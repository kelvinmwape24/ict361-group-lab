name: Android

# Builds the APK and runs the unit tests in the cloud on every push.
#
# Why this exists: nobody needs Android Studio installed to get a working APK.
# Push your branch, wait ~4 minutes, download app-debug.apk from the run's
# Artifacts section, and install it on a phone with:
#     adb install -r app-debug.apk
# or by copying the file to the phone and tapping it.
#
# It is also evidence: a green run on every commit is a stronger claim than
# "it built on my machine".

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # lets you start a run by hand from the Actions tab

jobs:
  build:
    name: Build APK and run unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # AGP 8.11 needs JDK 17 or newer.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # This used to be android-actions/setup-android@v3. That action installs
      # a default package list of "tools platform-tools", and Google has removed
      # "tools" from the SDK repository, so sdkmanager exits 1 and the job dies
      # before any code is touched:
      #     Warning: Failed to find package 'tools'
      #     Error: The process '.../sdkmanager' failed with exit code 1
      # The action was also replacing the runner's preinstalled command-line
      # tools with a downloaded copy. The runner already ships a working SDK
      # with its licences accepted, so use that instead and drop the dependency.
      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"           >> "$GITHUB_PATH"
          echo "Using SDK at $SDK"
          ls "$SDK/licenses" || echo "no licences directory"

      # compileSdk 36 and build-tools 36.0.0, as app/build.gradle.kts declares.
      - name: Install the platform this project compiles against
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      # The fake-repository tests — Activity B competency evidence. No device.
      - name: Unit tests
        working-directory: android
        run: ./gradlew test --stacktrace

      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Keep these even when the build fails — the report says what broke.
      - name: Upload the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: android/app/build/reports/tests/
          if-no-files-found: ignore

  instrumented:
    name: Room migration test on an emulator
    # Slow (~10 minutes) because it boots an emulator, so it does not run on
    # every push. Start it from the Actions tab when you need the evidence.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Same reason as the build job above: the action asks sdkmanager for the
      # removed "tools" package and fails. android-emulator-runner brings its
      # own system image, so this only needs the SDK on PATH.
      - name: Set up the Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_HOME=$SDK"     >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools"           >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x gradlew

      - name: Run the instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --stacktrace

      - name: Upload the instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-report
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
